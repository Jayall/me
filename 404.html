<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = "/me/";
        var location = window.location;
        if (location.pathname.indexOf(base) === 0) {
          var path = location.pathname.slice(base.length).replace(/&/g, "~and~");
          location.replace(
            base + "?/" + path + location.search + location.hash,
          );
        }
      })();
    </script>
  </head>
  <body></body>
</html>
